<title>프라하·드레스덴 허니문 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: full-height split, drawn map of the Vltava on the left, place list on the right; stacks on phones */
:root{
  --bg:#f2f4f6; --land:#e8ecef; --surface:#ffffff; --fg:#1c2330; --muted:#5b6676; --line:#d4dae1;
  --river:#a8c9de; --river-label:#4d7894; --park:#d4e4d0; --castle:#e6dccd;
  --sight:#2f55c8; --food:#c63f2e; --cafe:#8a5a2b; --night:#7a3aa8; --xmas:#16835a; --hotel:#d98a1c;
  --font-display:"Nanum Myeongjo", "AppleMyungjo", serif;
  --font-body:"Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --land:#191f27; --surface:#1d242d; --fg:#e5eaf1; --muted:#97a2b2; --line:#2c3540;
  --river:#284760; --river-label:#7fa8c4; --park:#1f2f28; --castle:#2e2a24;
  --sight:#7393ff; --food:#ff7b67; --cafe:#d49c64; --night:#bb8cf2; --xmas:#3fc28a; --hotel:#f2a94a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --land:#191f27; --surface:#1d242d; --fg:#e5eaf1; --muted:#97a2b2; --line:#2c3540;
  --river:#284760; --river-label:#7fa8c4; --park:#1f2f28; --castle:#2e2a24;
  --sight:#7393ff; --food:#ff7b67; --cafe:#d49c64; --night:#bb8cf2; --xmas:#3fc28a; --hotel:#f2a94a; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px}
.app{display:flex;height:100%;min-height:0}
.mapwrap{flex:1;position:relative;min-width:0;background:var(--land);overflow:hidden;touch-action:none}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.side{width:390px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface);min-height:0}
header.head{padding-block:18px 12px;padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:grid;gap:10px}
h1{font-family:var(--font-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:0;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.chip:focus-visible,.item:focus-visible,.ctl button:focus-visible{outline:2px solid var(--sight);outline-offset:2px}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums}
input#q{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
.list{overflow-y:auto;flex:1;min-height:0;padding-bottom:24px}
.area{position:sticky;top:0;background:var(--surface);padding:12px 18px 6px;font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);z-index:1}
.item{display:grid;grid-template-columns:12px 1fr;gap:4px 10px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.item:hover{background:var(--bg)}
.item.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--fg)}
.item .dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.item .nm{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;min-width:0}
.item .en{font-weight:400;color:var(--muted);font-size:12px}
.item .tp{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.5}
.meal{font-size:11px;font-weight:500;border:1px solid currentColor;border-radius:4px;padding:0 5px;color:var(--food)}
.ctl{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.ctl button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ctl button.wide{font-size:11px;line-height:1.1}
.card{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:min(360px, calc(100% - 24px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 4px 18px rgba(0,0,0,.16);display:grid;gap:6px}
.card h2{margin:0;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .meta{font-size:12px;color:var(--muted)}

.card a{color:var(--sight);font-weight:500;font-size:13px}

.legend{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--muted)}
.pin circle{stroke:var(--surface);cursor:pointer}
.pin.sel circle{stroke:var(--fg)}
.pin text{fill:var(--fg);paint-order:stroke;stroke:var(--land);font-family:var(--font-body);font-weight:500;pointer-events:none}
.lbl{fill:var(--muted);font-family:var(--font-display);font-weight:800;letter-spacing:.06em;pointer-events:none;opacity:.75}
.rlbl{fill:var(--river-label);font-style:italic;font-family:var(--font-display);pointer-events:none}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;padding:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--surface)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap;display:grid;gap:1px;text-align:left}
.day b{font-size:13px}.day span{color:var(--muted);font-size:11px}
.day[aria-pressed="true"]{border-color:var(--dc);box-shadow:inset 0 -3px 0 var(--dc)}
.dayhead{padding:14px 18px 8px;display:grid;gap:4px;border-bottom:1px solid var(--line)}
.dayhead h3{margin:0;font-family:var(--font-display);font-size:18px}
.dayhead p{margin:0;color:var(--muted);font-size:12px}
.stop{display:grid;grid-template-columns:44px 22px 1fr 56px;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.stop:hover,.stop.sel{background:var(--bg)}
.stop .tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding-top:2px}
.stop .no{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.stop .nm{font-weight:700;min-width:0}.stop .nt{color:var(--muted);font-size:12.5px;line-height:1.45;margin-top:2px}
.thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--bg)}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font-size:10px;border:1px dashed var(--line);box-sizing:border-box}
.item{grid-template-columns:12px 1fr 56px!important}
.item .tp{grid-column:2!important}
.item .thumb{grid-column:3;grid-row:1 / span 2}
.card img{width:100%;height:150px;object-fit:cover;border-radius:6px}
.card .tip{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:12.5px;line-height:1.55}
.card .tip b{color:var(--fg)}
.guide{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px}
.guide summary{font-weight:700;cursor:pointer;font-size:13px}
.guide .gs{margin-top:8px}.guide .gs b{font-size:12px;color:var(--sight)}
.guide ul{margin:3px 0 0;padding-left:18px;display:grid;gap:3px;line-height:1.5}.guide p{margin:3px 0 0}
.bk{display:grid;grid-template-columns:26px 1fr;gap:4px 10px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:start;cursor:pointer}
.bk:hover{background:var(--bg)}
.bk input{width:20px;height:20px;margin-top:2px;accent-color:var(--fg)}
.bk .bt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:700}
.bk .bt .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;font-size:12.5px}
.bk .bw{grid-column:2;font-size:13px}
.bk .bn{grid-column:2;font-size:12px;color:var(--muted);line-height:1.45}
.bk .bl{grid-column:2;font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.bk .bl a{color:var(--sight)}
.bk.done .bt,.bk.done .bw{text-decoration:line-through;opacity:.55}
.st{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 6px;color:#fff}
.st.must{background:var(--food)}.st.rec{background:var(--sight)}.st.check{background:var(--hotel)}.st.done{background:var(--xmas)}.st.none,.st.walk{background:var(--muted)}
.bsum{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px;font-size:12.5px;color:var(--muted)}
.bsum .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bday{position:sticky;top:0;background:var(--surface);padding:10px 16px 6px;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);z-index:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);color:var(--fg);border-radius:14px;max-width:760px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mhead{position:sticky;top:0;background:var(--surface);padding:16px 18px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px;z-index:2}
.mhead h2{margin:0;font-family:var(--font-display);font-size:20px;padding-right:40px}
.mhead p{margin:0;color:var(--muted);font-size:12.5px}
.mclose{position:absolute;top:10px;right:10px;width:40px;height:40px;border:0;border-radius:8px;background:var(--bg);color:var(--fg);font-size:22px;cursor:pointer}
.mtabs{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.mtabs button{flex:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;min-height:36px}
.mtabs button[aria-selected="true"]{background:var(--fg);color:var(--surface)}
.msec{padding:12px 18px 18px;display:grid;gap:8px}
.mfacts{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px;line-height:1.55;color:var(--muted)}
.tl{display:grid;grid-template-columns:48px 1fr;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tl .t{font-weight:700;font-variant-numeric:tabular-nums}
.tl .w{font-weight:700}.tl .pk{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px}
.tl .n{grid-column:2;color:var(--muted);font-size:12.5px;line-height:1.5}
.tl .w.opt{opacity:.75}
.rd{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.rd .v{font-size:11px;font-weight:700;border-radius:4px;padding:2px 7px;color:#fff;margin-top:2px}
.rd .v.추천{background:var(--xmas)}.rd .v.선택{background:var(--sight)}.rd .v.패스{background:var(--muted)}
.rd .nm2{font-weight:700}.rd .pr{font-size:10.5px;font-weight:700;color:var(--food);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}
.rd .why{grid-column:2;color:var(--muted);font-size:12.5px}
.rd .pkn{font-size:11px;color:var(--muted);margin-left:6px}
.mgrp{font-weight:700;font-size:12.5px;color:var(--muted);padding-top:8px}
.fd{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:3px;font-size:13px}
.fd b{font-size:14px}.fd span{color:var(--muted);font-size:12px}
.dbtn{border:0;border-radius:8px;background:var(--fg);color:var(--surface);font:inherit;font-weight:700;font-size:13px;padding:9px 12px;cursor:pointer;justify-self:start}
@media (max-width:760px){.modal{padding:0;align-items:stretch}.mbox{border-radius:0;max-height:100dvh}}
.seg{padding:4px 18px 4px 72px;font-size:11.5px;color:var(--muted);border-bottom:1px dashed var(--line);display:grid;gap:4px}
.seg a{color:var(--sight)}
.seg.ride{background:var(--bg)}
.segbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;min-height:32px}
.tres{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg);font-size:12.5px}
.tres ol{margin:6px 0;padding-left:18px;display:grid;gap:5px;line-height:1.45}
.tres .tsum{font-weight:700}.tres .muted{color:var(--muted);font-size:11.5px}
@media (max-width:760px){.seg{padding-left:64px}}
.ob{font-size:10.5px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.stop.opt .tm,.stop.opt .nm{opacity:.72}.stop.opt .no{opacity:.6}
.gb{font-size:10.5px;font-weight:700;color:var(--sight);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.rev{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;gap:5px}
.rev .rh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px}.rev .rh span{color:var(--muted)}
.sr{display:grid;grid-template-columns:44px 1fr 28px;gap:8px;align-items:center;font-size:12px}
.sr .bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.sr .bar i{display:block;height:100%;background:var(--food)}
.sr b{font-variant-numeric:tabular-nums;text-align:right}
.rev .rs{font-size:12.5px;line-height:1.5;margin:2px 0 0}
.rl{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.menu{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12.5px}
.menu b{font-size:12px}
.menu ol{margin:4px 0 0;padding-left:18px;display:grid;gap:2px}
.mn{font-size:12px;color:var(--food);margin-top:3px;line-height:1.45}
.links{display:flex;flex-wrap:wrap;gap:6px 12px}
.card .credit{font-size:10.5px;color:var(--muted)}
.card{max-height:calc(100% - 24px);overflow-y:auto}
.src{font-size:11.5px;color:var(--muted);line-height:1.5}
.grab{display:none}
@media (max-width:760px){
  html,body{height:100%;overflow:hidden}
  .app{display:block;height:100dvh}
  .mapwrap{position:fixed;inset:0;height:auto}
  .legend{display:none}
  .side{position:fixed;left:0;right:0;bottom:0;width:auto;height:var(--sheet-h,50dvh);border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);z-index:20;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.dragging{transition:none}

  .day{min-height:44px;padding:6px 12px}
  .chip{min-height:36px;padding:6px 12px}
  input#q{font-size:16px;min-height:42px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mbox" id="mbox"></div></div>
<div class="app">
  <div class="mapwrap" id="wrap">
    <svg id="map" role="img" aria-label="도시 중심부 지도와 장소 핀"></svg>
    <div class="legend">드래그로 이동 · 휠/핀치로 확대 · 동선은 직선 표시</div>
    <div class="ctl">
      <button id="zin" aria-label="확대">+</button>
      <button id="zout" aria-label="축소">−</button>
      <button id="zall" class="wide" aria-label="전체 보기">전체</button>
    </div>
    <div class="card" id="card" hidden></div>
  </div>
  <aside class="side">
    <button class="grab" id="grab" aria-label="목록 크기 바꾸기"><span></span></button>
    <header class="head">
      <h1>허니문 지도</h1>
      <div class="tabs" id="cityTabs" role="tablist"></div>
      <p class="sub" id="sub"></p>
      <div class="tabs" role="tablist">
        <button id="tab-plan" role="tab" aria-selected="true">날짜별 동선</button>
        <button id="tab-all" role="tab" aria-selected="false">장소 <span id="total"></span>곳</button>
        <button id="tab-book" role="tab" aria-selected="false">예약 <span id="bookN"></span></button>
      </div>
      <div id="planCtl" class="days"></div>
      <div id="allCtl" hidden style="display:grid;gap:10px">
        <div class="chips" id="chips"></div>
        <input id="q" type="search" placeholder="이름·메뉴·키워드 검색 (예: 꼴레뇨, 야경)">
      </div>
    </header>
    <div class="list" id="list"></div>
  </aside>

let vb={x:0,y:0,w:1000,h:1000};
let mode='plan', day=0;
const active=new Set(Object.keys(CATS));
let query='', selected=null;
const dayKeys=()=>new Set(PLAN[day].stops.map(s=>s.k));
function visible(p){
  if(mode==='plan') return dayKeys().has(p.k);
  if(mode==='book') return (window.bookKeys?window.bookKeys():new Set()).has(p.k);
  if(!active.has(p.c))return false;
  if(!query)return true;
  return (p.n+' '+p.en+' '+p.t+' '+(p.tip||'')+' '+p.a+' '+(p.m||'')+' '+CATS[p.c].label).toLowerCase().includes(query);
}
function drawRoute(){
  routeLayer.innerHTML='';
  if(mode!=='plan')return;
  const pts=PLAN[day].stops.map(s=>BYK[s.k]).filter(Boolean);
  el('path',{d:pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(0)+' '+p.y.toFixed(0)).join(' '),fill:'none',stroke:PLAN[day].color,'stroke-linejoin':'round','stroke-linecap':'round',opacity:.8,class:'route'},routeLayer);
}
function render(){
  const r=svg.getBoundingClientRect(); const sw=r.width||800, sh=r.height||600, asp=sw/sh;
  if(vb.w/vb.h>asp){const nh=vb.w/asp;vb.y-=(nh-vb.h)/2;vb.h=nh;}else{const nw=vb.h*asp;vb.x-=(nw-vb.w)/2;vb.w=nw;}
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k=vb.w/sw, showLabels=k<1.9||mode==='plan';
  const order={}; if(mode==='plan'){PLAN[day].stops.forEach((s,i)=>{(order[s.k]=order[s.k]||[]).push(i+1);});}
  const rp=routeLayer.querySelector('.route'); if(rp){rp.setAttribute('stroke-width',4*k);rp.setAttribute('stroke-dasharray',`${10*k} ${6*k}`);}
  PLACES.forEach((p,i)=>{
    const v=visible(p); p.g.style.display=v?'':'none'; if(!v)return;
    const sel=selected===i, numbered=mode==='plan'&&order[p.k];
    const rad=numbered?10:(sel?9:6.5);
    p.circle.setAttribute('r',rad*k);
    p.circle.setAttribute('stroke-width',(sel?2.5:1.5)*k);
    if(numbered){p.circle.setAttribute('fill',p.c==='hotel'?'var(--hotel)':PLAN[day].color);p.num.textContent=p.c==='hotel'?'H':order[p.k][0];}
    else{p.circle.setAttribute('fill',`var(${CATS[p.c].v})`);p.num.textContent='';}
    p.num.setAttribute('font-size',10.5*k); p.num.setAttribute('y',3.8*k);
    p.text.setAttribute('font-size',12*k); p.text.setAttribute('x',(rad+4)*k); p.text.setAttribute('y',4*k); p.text.setAttribute('stroke-width',3*k);
    p.text.style.display=(showLabels||sel)?'':'none';
    p.g.classList.toggle('sel',sel);
  });
  if(selected!==null)pinLayer.appendChild(PLACES[selected].g);
  areaTexts.forEach(t=>t.setAttribute('font-size',Math.min(15*k,140)));
  if(riverText)riverText.setAttribute('font-size',13*k);
}
function fitTo(list,pad){
  if(!list.length)return;
  const xs=list.map(p=>p.x), ys=list.map(p=>p.y), m=pad||250;
  vb={x:Math.min(...xs)-m,y:Math.min(...ys)-m,w:Math.max(...xs)-Math.min(...xs)+2*m,h:Math.max(...ys)-Math.min(...ys)+2*m};
  render();
}
function zoomAt(f,cx,cy){
  const nw=Math.min(Math.max(vb.w*f,250),W*1.6), ff=nw/vb.w;
  vb.x=cx-(cx-vb.x)*ff; vb.y=cy-(cy-vb.y)*ff; vb.w*=ff; vb.h*=ff; render();
}
const toMap=(cx,cy)=>{const r=svg.getBoundingClientRect();return [vb.x+(cx-r.left)/r.width*vb.w, vb.y+(cy-r.top)/r.height*vb.h];};
svg.addEventListener('wheel',e=>{e.preventDefault();const [mx,my]=toMap(e.clientX,e.clientY);zoomAt(Math.exp(e.deltaY*0.0015),mx,my);},{passive:false});
const ptrs=new Map(); let lastDist=null, moved=0;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;svg.classList.add('drag');});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const prev=ptrs.get(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const r=svg.getBoundingClientRect();
  if(ptrs.size===1){const dx=e.clientX-prev[0], dy=e.clientY-prev[1]; moved+=Math.abs(dx)+Math.abs(dy); vb.x-=dx/r.width*vb.w; vb.y-=dy/r.height*vb.h; render();}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); if(lastDist){const [mx,my]=toMap((a[0]+b[0])/2,(a[1]+b[1])/2);zoomAt(lastDist/d,mx,my);} lastDist=d; moved+=10;}
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)lastDist=null;if(!ptrs.size)svg.classList.remove('drag');};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(moved<5&&!e.target.closest('.pin')){selected=null;card.hidden=true;markList();render();}});

function links(p){

const hav=(a,b)=>{const R=6371,t=x=>x*Math.PI/180;const dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
function segHtml(a,b){
  if(!a||!b||a.k===b.k) return '';
  const km=hav(a,b), walkMin=Math.round(km*1.3/4.8*60);
  const gurl=`https://www.google.com/maps/dir/?api=1&origin=${a.lat},${a.lng}&destination=${b.lat},${b.lng}&travelmode=`;
  if(km<0.9) return `<div class="seg walk">↓ 도보 약 ${Math.max(1,walkMin)}분 <a href="${gurl}walking" target="_blank" rel="noopener">길찾기 ↗</a></div>`;
  return `<div class="seg ride"><span>↓ 약 ${km.toFixed(1)}km · 교통편 필요 (도보면 약 ${walkMin}분)</span>
    <span class="segbtns">${window.showTransit?`<button class="tbtn" data-from="${a.k}" data-to="${b.k}">추천 이동 방법</button>`:''}<a href="${gurl}transit" target="_blank" rel="noopener">구글 지도 대중교통 ↗</a></span>
    <div class="tres" hidden></div></div>`;
}

function openDisney(tab){
  const D=DISNEY; tab=tab||'time';
  const tabs=[['time','시간표'],['rides','어트랙션'],['food','식사'],['tips','팁']];
  let body='';
  if(tab==='time') body=`<ul class="mfacts">${D.facts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`+D.timeline.map(x=>`<div class="tl"><span class="t">${esc(x.t)}</span><span class="w${/\(선택\)/.test(x.what)?' opt':''}">${esc(x.what)}<span class="pk">${esc(x.park)}</span></span><span class="n">${esc(x.note)}</span></div>`).join('');
  if(tab==='rides'){ const grp=v=>D.rides.filter(r=>r.v===v); body=['추천','선택','패스'].map(v=>`<div class="mgrp">${v==='패스'?'패스 (낙하·코스터·공포)':v} · ${grp(v).length}</div>`+grp(v).map(r=>`<div class="rd"><span class="v ${r.v}">${r.v}</span><span class="nm2">${esc(r.n)}${r.paris?'<span class="pr">파리 전용</span>':''}<span class="pkn">${esc(r.park)}</span></span><span class="why">${esc(r.why)}</span></div>`).join('')).join(''); }
  if(tab==='food') body=D.food.map(f=>`<div class="fd"><b>${esc(f.n)}</b><span>${esc(f.when)} · ${esc(f.where)}</span><div>${esc(f.what)}</div><span>${esc(f.tip)}</span></div>`).join('');
  if(tab==='tips') body=`<ul class="mfacts" style="color:var(--fg)">${D.tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  mbox.innerHTML=`<div class="mhead"><h2 id="mTitle">${esc(D.title)}</h2><p>${esc(D.sub)}</p><button class="mclose" aria-label="닫기">×</button>
    <div class="mtabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join('')}</div></div>
    <div class="msec">${body}<p class="src" style="margin:8px 0 0">파크 운영·퍼레이드·쇼 시간은 공식 앱에서 당일 확인하세요. 어트랙션 정보는 일반적으로 알려진 내용 기준이에요.</p></div>`;
  mbox.querySelector('.mclose').onclick=closeModal;
  mbox.querySelectorAll('.mtabs button').forEach(b=>b.onclick=()=>{openDisney(b.dataset.t); mbox.scrollTop=0;});
  modal.hidden=false;
}
window.openDisney=openDisney;
const ST={must:'예약 필수',rec:'예약 추천',check:'확인 필요',done:'완료',none:'예약 불가',walk:'현장 탑승'};
const resKey=r=>'res:'+r.city+':'+r.d+':'+r.k+':'+r.what;
const isDone=r=>{ if(r.st==='done') return true; try{return localStorage.getItem(resKey(r))==='1';}catch(e){return false;} };
function curCityKey(){ return Object.keys(CITIES).find(k=>CITIES[k]===C); }
window.bookKeys=()=>{ const ck=curCityKey(); return new Set(RES.filter(r=>r.city===ck||(ck==='prague'&&r.city==='prague')).map(r=>r.k)); };
const dnum=d=>{const [m,dd]=d.split('/').map(Number); return m*100+dd;};
const tnum=t=>/^\d/.test(t)?parseInt(t.replace(':',''),10):9999;
function buildBook(){
  listEl.innerHTML='';
  const act=RES.filter(r=>r.st!=='none'&&r.st!=='walk');
  const cnt=k=>act.filter(r=>r.st===k&&!isDone(r)).length;
  const done=act.filter(isDone).length;
  const sm=document.createElement('div'); sm.className='bsum';
  sm.innerHTML=`<div class="row"><span class="st must">예약 필수</span> ${cnt('must')} <span class="st rec">예약 추천</span> ${cnt('rec')} <span class="st check">확인 필요</span> ${cnt('check')} <span class="st done">완료</span> ${done}</div>
    <div>다섯 도시 예약 항목을 날짜순으로 모았어요. 예약을 마치면 체크하세요 (이 브라우저에만 저장). 줄을 누르면 지도에서 위치를 보여줘요.</div>`;
  listEl.appendChild(sm);
  const sorted=RES.map((r,i)=>({...r,i})).sort((a,b)=>dnum(a.d)-dnum(b.d)||tnum(a.time)-tnum(b.time));
  let last='';
  sorted.forEach(r=>{
    const city=CITIES[r.city]; const p=city.places.find(x=>x.k===r.k);
    if(r.d!==last){ last=r.d; const h=document.createElement('div'); h.className='bday'; h.textContent=r.d+' · '+city.name; listEl.appendChild(h); }
    const el=document.createElement('div'); const dn=isDone(r); el.className='bk'+(dn?' done':'');
    const offi=p&&p.links?(p.links.find(l=>/공식|관광청|예약/.test(l.t)&&!/유튜브|인스타/.test(l.t))||null):null;
    const gm=p?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.en+' '+city.en)}`:'';
    el.innerHTML=`<input type="checkbox" ${dn?'checked':''} ${r.st==='done'||r.st==='none'||r.st==='walk'?'disabled':''} aria-label="예약 완료 체크">
      <div class="bt"><span class="tm">${esc(r.time)}</span>${esc(p?p.n:r.k)} <span class="st ${r.st}">${ST[r.st]}</span></div>
      <div class="bw">${esc(r.what)}</div>
      <div class="bn">${esc(r.note||'')}</div>
      <div class="bl">${offi?`<a href="${esc(offi.u)}" target="_blank" rel="noopener">${esc(offi.t)} ↗</a>`:''}${gm?`<a href="${gm}" target="_blank" rel="noopener">구글 지도 ↗</a>`:''}</div>`;
    const cb=el.querySelector('input');
    cb.addEventListener('click',e=>{e.stopPropagation(); try{localStorage.setItem(resKey(r),cb.checked?'1':'0');}catch(_){} buildBook(); render();});
    el.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
    el.addEventListener('click',()=>{ if(CITIES[r.city]!==C){ setCity(r.city); setMode('book'); } if(p) select(p.id,true); });
    listEl.appendChild(el);
  });
  const n=document.getElementById('bookN'); if(n) n.textContent=act.filter(r=>!isDone(r)).length;
}
const planCtl=document.getElementById('planCtl'), allCtl=document.getElementById('allCtl'), chips=document.getElementById('chips');
function buildControls(){
  planCtl.innerHTML='';
  PLAN.forEach((D,i)=>{
    const b=document.createElement('button');b.className='day';b.style.setProperty('--dc',D.color);
    b.setAttribute('aria-pressed',i===day);
    b.innerHTML=`<b>${D.d} ${D.w}</b><span>${esc(D.title.split(' · ')[0])}</span>`;
    b.onclick=()=>{day=i;planCtl.querySelectorAll('.day').forEach((x,j)=>x.setAttribute('aria-pressed',j===i));selected=null;card.hidden=true;build();fitTo(PLAN[day].stops.map(s=>BYK[s.k]).filter(Boolean),220);};
    planCtl.appendChild(b);
  });
  chips.innerHTML='';
  for(const k in CATS){
    const n=PLACES.filter(p=>p.c===k).length; if(!n)continue;
    const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',active.has(k));
    b.innerHTML=`<span class="dot" style="background:var(${CATS[k].v})"></span>${CATS[k].label}<span class="n">${n}</span>`;
    b.onclick=()=>{active.has(k)?active.delete(k):active.add(k);b.setAttribute('aria-pressed',active.has(k));build();render();};
    chips.appendChild(b);
  }
  document.getElementById('total').textContent=PLACES.length;
}
function setMode(m){
  mode=m; selected=null; card.hidden=true;
  document.getElementById('tab-plan').setAttribute('aria-selected',m==='plan');
  document.getElementById('tab-all').setAttribute('aria-selected',m==='all');
  document.getElementById('tab-book').setAttribute('aria-selected',m==='book');
  planCtl.hidden=m!=='plan'; allCtl.hidden=m!=='all';
  build();
  if(m==='book'){ const bk=window.bookKeys(); fitTo(PLACES.filter(p=>bk.has(p.k)),200); return; }
  fitTo(m==='plan'?PLAN[day].stops.map(s=>BYK[s.k]).filter(Boolean):PLACES.filter(p=>p.lat>C.core[0]&&p.lat<C.core[2]&&p.lng>C.core[1]&&p.lng<C.core[3]),m==='plan'?220:150);
}
const cityTabs=document.getElementById('cityTabs');
function setCity(key){
  C=CITIES[key]; PLACES=C.places; PLAN=C.plan; BYK={}; day=C.startDay||0; query=''; document.getElementById('q').value='';
  PLACES.forEach((p,i)=>{p.id=i;[p.x,p.y]=P(p.lat,p.lng);BYK[p.k]=p;});
  document.getElementById('sub').textContent=C.sub;
  cityTabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===key));
  drawBase(); makePins(); buildControls(); setMode('plan');
  try{localStorage.setItem('city',key);}catch(e){}
}
Object.keys(CITIES).forEach(k=>{

// mobile sheet
(function(){
  const side=document.querySelector('.side'), grab=document.getElementById('grab'), head=document.querySelector('header.head');
  const mq=matchMedia('(max-width:760px)'); let state='half';
  const hFor=st=>{const vh=innerHeight; if(st==='peek') return Math.min(head.offsetHeight+30, vh*0.45); if(st==='full') return vh*0.88; return vh*0.56;};
  window.sheetHeight=()=>mq.matches?side.getBoundingClientRect().height:0;
  function set(st,px){
    if(!mq.matches){document.documentElement.style.removeProperty('--sheet-h');return;}
    if(st) state=st;
    document.documentElement.style.setProperty('--sheet-h',(px??hFor(state))+'px');
    side.dataset.sheet=state;
  }
  window.setSheet=set;
  const order=['peek','half','full'];
  let startY=null,startH=0,moved=0;
  grab.addEventListener('pointerdown',e=>{if(!mq.matches)return; startY=e.clientY; startH=side.getBoundingClientRect().height; moved=0; side.classList.add('dragging'); grab.setPointerCapture(e.pointerId);});
  grab.addEventListener('pointermove',e=>{if(startY===null)return; const dy=startY-e.clientY; moved=Math.max(moved,Math.abs(dy)); const h=Math.max(90,Math.min(innerHeight*0.92,startH+dy)); document.documentElement.style.setProperty('--sheet-h',h+'px');});
  const end=e=>{ if(startY===null)return; side.classList.remove('dragging');
    const h=side.getBoundingClientRect().height; startY=null;
    if(moved<6){ set(order[(order.indexOf(state)+1)%3]); return; }
    let best='half',bd=1e9; for(const st of order){const d=Math.abs(hFor(st)-h); if(d<bd){bd=d;best=st;}} set(best); };
  grab.addEventListener('pointerup',end); grab.addEventListener('pointercancel',end);
  new MutationObserver(()=>{ if(mq.matches && !card.hidden) set('peek'); }).observe(card,{attributes:true,attributeFilter:['hidden']});
  mq.addEventListener('change',()=>set()); addEventListener('resize',()=>set());
  set('half');
})();
